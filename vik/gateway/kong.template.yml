_format_version: "3.0"
_transform: true

# Cloud Run deployment template — same routing/rate-limiting shape as
# kong.yml (used by local docker-compose), but upstream `url:` fields are
# ${VAR} placeholders substituted at container start by
# cloudrun-entrypoint.sh. Cloud Run assigns each service's real URL only
# after its first deploy (unlike a predictable hostname), so the CI
# workflow captures those and passes them in as env vars — see
# Dockerfile.cloudrun and .github/workflows/ci.yml's deploy job.

services:
  - name: svc-agent
    url: ${SVC_AGENT_URL}
    routes:
      - name: agent-route
        paths:
          - /api/agent
        strip_path: true
    plugins:
      - name: cors
        config:
          origins:
            - ${FRONTEND_ORIGIN}
            - http://localhost:5173
            - http://localhost:5174
            - http://localhost:5175
            - http://localhost:4173
          methods: [GET, POST, OPTIONS]
          headers: [Content-Type]
      - name: rate-limiting
        config:
          minute: 20
          policy: local

  - name: svc-rag
    url: ${SVC_RAG_URL}
    routes:
      - name: rag-route
        paths:
          - /api/rag
        strip_path: true
    plugins:
      - name: rate-limiting
        config:
          minute: 30
          policy: local

  - name: svc-guard
    url: ${SVC_GUARD_URL}
    routes:
      - name: guard-route
        paths:
          - /api/guard
        strip_path: true

  - name: svc-voice
    url: ${SVC_VOICE_URL}
    routes:
      - name: voice-route
        paths:
          - /api/voice
        strip_path: true

  - name: svc-translate
    url: ${SVC_TRANSLATE_URL}
    routes:
      - name: translate-route
        paths:
          - /api/translate
        strip_path: true

  - name: svc-vision
    url: ${SVC_VISION_URL}
    routes:
      - name: vision-route
        paths:
          - /api/vision
        strip_path: true

  # svc-crm intentionally not deployed to Cloud Run this pass — needs a
  # managed Postgres, which isn't in Cloud Run's free tier (Cloud SQL
  # costs from the first byte), and it's not on the live chat path yet
  # anyway (svc-agent's capture_lead tool doesn't call it). Local
  # docker-compose's kong.yml still has the full svc-crm route.
