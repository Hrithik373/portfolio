# render.yaml — place in project root
# Render Blueprint: defines your backend service configuration
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: hrithik-portfolio-api
    runtime: node
    region: oregon   # or singapore, frankfurt — pick closest to your users
    plan: free
    buildCommand: npm install
    startCommand: npm run start:server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: CORS_ORIGINS
        value: "https://yourdomain.com,https://www.yourdomain.com"
      - key: ANTHROPIC_API_KEY
        sync: false  # set manually in Render dashboard — never in code
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "noreply@yourdomain.com"
      - key: EMAIL_TO
        value: "hrithikgh29@gmail.com"
      - key: ABUSE_ADMIN_PASSWORD
        sync: false  # set manually in Render dashboard — never in code
      - key: OPENAI_API_KEY
        sync: false  # for Whisper transcription — set in dashboard
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false  # Upstash Redis REST URL — set in Render dashboard
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false  # Upstash Redis REST token — set in Render dashboard
      - key: SPOTIFY_CLIENT_ID
        sync: false  # Spotify app client ID — create app at developer.spotify.com
      - key: SPOTIFY_CLIENT_SECRET
        sync: false  # Spotify app client secret
      - key: SPOTIFY_PLAYLIST_ID
        sync: false  # Public playlist ID to display (e.g. 37i9dQZF1DX... from the URL)
    autoDeploy: true
    # Free tier spins down after 15 min inactivity — first request takes ~30s.
    # Consider UptimeRobot (free) to ping /api/health every 14 min to stay warm.
    # NOTE: Free tier has an ephemeral filesystem — all persistent data (abuse log,
    # device intel, visitors) is stored in Upstash Redis. Set UPSTASH_REDIS_REST_URL
    # and UPSTASH_REDIS_REST_TOKEN in the Render dashboard before deploying.

  # ══════════════════════════════════════════════════════════════════
  # Vik backend — see vik/ARCHITECTURE.md §9 for the hosting-tier
  # rationale and vik/README.md for exactly what's deployed here vs.
  # docker-compose-only (Kafka/ArcadeDB/ArangoDB/Ollama/Mongo/Keycloak/
  # Prometheus/Grafana are deliberately not part of this Blueprint —
  # see that README for why each one specifically isn't).
  #
  # All free tier: each service spins down after 15 min idle (~30-50s
  # cold start on the next request); a request through Kong can chain
  # through 2-3 idle services on a cold first hit. svc-rag's build
  # bakes in torch + sentence-transformers + FAISS — free tier's ~512MB
  # RAM may be tight; if it OOMs, that service specifically needs a
  # paid instance size (this can't be verified without an actual
  # deploy from this session).
  # ══════════════════════════════════════════════════════════════════

  - type: web
    name: vik-kong
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./vik/gateway/Dockerfile.render
    dockerContext: ./vik/gateway
    healthCheckPath: /
    envVars:
      # Literal predicted URLs, matching the service `name:` fields below —
      # if Render appended a collision suffix to any of them, fix the
      # corresponding value here (render-entrypoint.sh has the same
      # defaults baked in as a fallback, but explicit is better).
      - key: SVC_AGENT_URL
        value: https://vik-svc-agent.onrender.com
      - key: SVC_RAG_URL
        value: https://vik-svc-rag.onrender.com
      - key: SVC_GUARD_URL
        value: https://vik-svc-guard.onrender.com
      - key: SVC_CRM_URL
        value: https://vik-svc-crm.onrender.com
      - key: SVC_VOICE_URL
        value: https://vik-svc-voice.onrender.com
      - key: SVC_TRANSLATE_URL
        value: https://vik-svc-translate.onrender.com
      - key: SVC_VISION_URL
        value: https://vik-svc-vision.onrender.com
      - key: FRONTEND_ORIGIN
        value: https://hrithikghosh.vercel.app
    autoDeploy: true

  - type: web
    name: vik-svc-agent
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./vik/svc-agent/Dockerfile
    dockerContext: ./vik/svc-agent
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false  # set manually in Render dashboard — same key as local vik/infra/.env
      - key: GROQ_MODEL_ANSWER
        value: llama-3.3-70b-versatile
      - key: SVC_RAG_URL
        value: https://vik-svc-rag.onrender.com
      - key: SVC_GUARD_URL
        value: https://vik-svc-guard.onrender.com
      # No OLLAMA_* here — free tier has no RAM/disk for a local model (see
      # README). This deploy is Groq-only; already tested to degrade
      # gracefully ("reasoning temporarily unavailable") if the quota is hit
      # rather than error.
    autoDeploy: true

  - type: web
    name: vik-svc-rag
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./vik/svc-rag/Dockerfile.render
    dockerContext: ./vik
    healthCheckPath: /health
    autoDeploy: true

  - type: web
    name: vik-svc-guard
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./vik/svc-guard/Dockerfile
    dockerContext: ./vik/svc-guard
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false  # set manually in Render dashboard — same key as local vik/infra/.env
      - key: GROQ_MODEL_JUDGE
        value: llama-3.3-70b-versatile
    autoDeploy: true

  - type: web
    name: vik-svc-crm
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./vik/svc-crm/Dockerfile
    dockerContext: ./vik/svc-crm
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        fromDatabase:
          name: vik-postgres
          property: connectionString
        # See svc-crm/src/main/resources/application.yml's comment — this
        # may need a `jdbc:` prefix added manually if Render's connection
        # string isn't already JDBC-formatted. Not verifiable from here.
      - key: DB_USER
        fromDatabase:
          name: vik-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: vik-postgres
          property: password
    autoDeploy: true

  - type: web
    name: vik-svc-voice
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./vik/svc-voice/Dockerfile
    dockerContext: ./vik/svc-voice
    healthCheckPath: /health
    envVars:
      - key: LOAD_MODELS
        value: "false"  # see vik/svc-voice/README.md — Whisper/Piper aren't installed yet
    autoDeploy: true

  - type: web
    name: vik-svc-translate
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./vik/svc-translate/Dockerfile
    dockerContext: ./vik/svc-translate
    healthCheckPath: /health
    envVars:
      - key: LOAD_MODELS
        value: "false"  # see vik/svc-translate/README.md — NLLB isn't installed yet
    autoDeploy: true

  - type: web
    name: vik-svc-vision
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./vik/svc-vision/Dockerfile
    dockerContext: ./vik/svc-vision
    healthCheckPath: /health
    autoDeploy: true

databases:
  - name: vik-postgres
    plan: free
    region: oregon
    databaseName: vikcrm
    user: vik
    # Render's free Postgres tier is deleted 30 days after creation — fine
    # for a demo/showcase database with no real persistence requirement
    # (svc-crm isn't wired to receive real leads from svc-agent yet), not
    # for anything meant to persist. Upgrade the plan before that matters.
