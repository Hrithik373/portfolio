name: vik-ci

on:
  push:
    branches: [main]
    paths: ["vik/**"]
  pull_request:
    paths: ["vik/**"]

defaults:
  run:
    working-directory: vik

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/vik

jobs:
  # ---- test ----
  test-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [svc-agent, svc-rag, svc-guard, svc-voice, svc-translate, svc-vision]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        working-directory: vik/${{ matrix.service }}
        run: pip install -r requirements.txt -r requirements-test.txt
      - name: Run tests
        working-directory: vik/${{ matrix.service }}
        run: pytest tests/ -v

  test-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests
        working-directory: vik/svc-crm
        run: mvn -B test

  test-frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web-widget, web-admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        working-directory: vik/${{ matrix.app }}
        run: npm ci
      - name: Typecheck + build
        working-directory: vik/${{ matrix.app }}
        run: npm run build

  # ---- eval-gate ----
  # Reuses ARA's LLM-as-Judge pattern. Retrieval recall@k hard-gates the
  # build; groundedness is informational in CI since no GROQ_API_KEY secret
  # is configured here (svc-agent/svc-guard fail open without one — see
  # eval/judge.py's module docstring). Set a GROQ_API_KEY repo secret to get
  # a real groundedness signal in CI too.
  eval-gate:
    runs-on: ubuntu-latest
    needs: [test-python]
    steps:
      - uses: actions/checkout@v4
      - name: Build KB index
        working-directory: vik
        run: docker compose -f infra/docker-compose.yml run --rm ingest
      - name: Start svc-rag, svc-agent, svc-guard
        working-directory: vik
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: docker compose -f infra/docker-compose.yml up -d svc-rag svc-agent svc-guard
      - name: Wait for services
        run: |
          for port in 8011 8010 8012; do
            for i in $(seq 1 30); do
              curl -sf "http://localhost:$port/health" && break
              sleep 2
            done
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run eval gate
        working-directory: vik/eval
        env:
          SVC_RAG_URL: http://localhost:8011
        run: |
          pip install -r requirements.txt
          python judge.py
      - name: Tear down
        if: always()
        working-directory: vik
        run: docker compose -f infra/docker-compose.yml down -v

  # ---- build ----
  # Only on push to main, and only after tests + the eval gate pass.
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [test-python, test-java, test-frontend, eval-gate]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          [svc-agent, svc-rag, svc-guard, svc-voice, svc-translate, svc-vision, svc-crm]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: vik/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest

  # ---- deploy ----
  # TODO: point this at a live k3s host once Tier 1 hosting (architecture
  # doc §9) actually exists. Left commented rather than faked — there is no
  # cluster for this to deploy to yet.
  deploy:
    if: false
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - run: echo "TODO -- helm upgrade --install vik infra/helm -f infra/helm/values.yaml"
